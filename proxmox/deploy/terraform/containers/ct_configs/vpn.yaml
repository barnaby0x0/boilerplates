---
id: "vpn"
replicas: 1
vm_id: 911
target_node: "pve"
description: "Container managed by terraform: vpn entrypoint"
tags: ["support", "network", "vpn", "terraform"]
hostname: "vpn"
firewall_enabled: false
cpu:
  cores: 1
memory:
  dedicated: 512
# secgroups:
#   - security_group: "test700"
#     comment: "From security group"
#     iface: "net0"
network_interfaces:
  eth0:
    name: "eth0"
    bridge: "vnet01"
    firewall: false
ipv4_configs:
  eth0:
    address: "10.0.0.201/24"
    gateway: "10.0.0.1"

disks:
  disk0:
    datastore_id: "local-lvm"
    size: 6

unprivileged: true

provision:
  enable: true
  connection:
    interface: "eth0"
  inline:
    - |
      sysctl -w net.ipv4.ip_forward=1
      apt update && apt install wireguard-tools vim -y
      cat << EOF > /etc/wireguard/wg0.conf
      [Interface]
      # ${vpn_publickey}
      PrivateKey = ${vpn_privatekey}
      Address = 172.16.0.7/32
      #PostUp = ping -c1 172.16.0.1
      PostUp = iptables -P FORWARD DROP
      PostUp = iptables -A FORWARD -s 172.16.0.1 -d 192.168.1.100 -j ACCEPT
      PostUp = iptables -A FORWARD -s 172.16.0.1 -d 192.168.1.114 -j ACCEPT
      PostUp = iptables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      PostUp = iptables -tnat -A POSTROUTING -o eth0 -j MASQUERADE
      PostDown = iptables -P FORWARD ACCEPT
      PostDown = iptables -D FORWARD -s 172.16.0.1 -d 192.168.1.100 -j ACCEPT
      PostDown = iptables -D FORWARD -s 172.16.0.1 -d 192.168.1.114 -j ACCEPT
      PostDown = iptables -D FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      PostDown = iptables -tnat -D POSTROUTING -o eth0 -j MASQUERADE
      
      [Peer]
      PublicKey = OcOa+0B13cYrrQvPcKbGx69bT47oH5ZDuT0cXHuYrzc=
      Endpoint = ${vps_wg_public_ip}:${vps_wg_public_port}
      AllowedIPs = 172.16.0.1/32
      PersistentKeepalive = 25
      EOF
      systemctl enable --now wg-quick@wg0 
      


hook_script_file_id: ""
deploy: true

## STARTUP
# copy the configuration file (b64) into /etc/wireguard/wg0.conf
# 
# wg-quick up wg0
# ping -c1 172.16.0.1 # for testing
