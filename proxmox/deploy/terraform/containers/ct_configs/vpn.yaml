---
id: "vpn"
replicas: 1
vm_id: 911
target_node: "pve"
description: "Container managed by terraform: vpn entrypoint"
tags: ["support", "network", "vpn", "terraform"]
hostname: "vpn"
firewall_enabled: false
cpu:
  cores: 1
memory:
  dedicated: 512
secgroups:
  - security_group: "test700"
    comment: "From security group"
    iface: "net0"
network_interfaces:
  eth0:
    name: "eth0"
    bridge: "vnet01"
    firewall: true
ipv4_configs:
  eth0:
    address: "10.0.0.201/24"
    gateway: "10.0.0.1"

disks:
  disk0:
    datastore_id: "local-lvm"
    size: 6

unprivileged: true

hook_script_file_id: ""
deploy: true
