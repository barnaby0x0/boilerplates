---
id: "radicale"
vm_id: 722
replicas: 1
template_id: "1000"
hostname: "radicale"
domain: "net.local"
cpu_type: "x86-64-v2-AES"
cpu_cores: 2
cpu_sockets: 1
memory: 2048
vm_user: "sysadmin"
disks:
 disk0:
    interface: "virtio0"
    storage: "local-lvm"
    size: 20
    iothread: true
    discard: "ignore"
vm_tags: ["carddav", "radicale", "terraform"]
template_tag: "router"
started: true
onboot: true
target_node: "pve"
target_node_domain: ""
dns_servers: ["8.8.8.8", "8.8.4.4"]
firewall_enabled: false
secgroups:
  - security_group: "test700"
    comment: "From security group"
    iface: "net0"
# fw_rules:
#   - type: "in"
#     action: "ACCEPT"
#     comment: "Allow HTTP"
#     dest: "192.168.1.5"
#     dport: "80"
#     proto: "tcp"
#     log: "info"
#     enabled: false

network_devices:
  eth0:
    bridge: "vnet01"
    addresses: "10.0.0.99/24"
    gateway4: "10.0.0.1"
    firewall: false
    dhcp: false          
users:
  - name: "user"
    password: "$6$tGz.h5alKsD5IOP2$yfQ1RTnXjdLnmCQxFG70Jf3d24YAb8Bsb/qZ/iW0aokkahPQ8qlRhgC2ZpVYkcK.CQh579k3IF3f2LTDAMsKH/"
    groups: "[adm, sudo]"
    lock_passwd: "false"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: "/bin/bash"
    ssh_authorized_keys: "\n      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP1oFq0GYt8j7vg2nNAJNzwBtqrdOUDp8CMQwLRiz4Vz user@ull\n      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKptwbs9lkk56DbyH8WXpSESgqiRDPHRjgI/grUPi4Vm user@nixos"

files:
  - path: /home/user/docker-compose.yml
    content: |
      name: Radicale
      services:
          radicale:
              image: ghcr.io/kozea/radicale:stable
              ports:
              - 5232:5232
              volumes:
                - config:/etc/radicale
                - data:/var/lib/radicale
      
      volumes:
        config:
          name: radicale-config
          driver: local
          driver_opts:
            type: none
            o: bind
            device: ./config
        data:
          name: radicale-data
          driver: local
          driver_opts:
            type: none
            o: bind
            device: ./data
    permissions: '0644'
    owner: root:root

cmds: [
  "usermod -aG docker user",
  "mkdir -p /home/user/data",
  "mkdir -p /home/user/config",
  "chown -R user:user /home/user/data",
  "chown -R user:user /home/user/config",
]

cloudinit_templates:
  user_data_path: "cloud-init/user_data_hostname"
deploy: true
