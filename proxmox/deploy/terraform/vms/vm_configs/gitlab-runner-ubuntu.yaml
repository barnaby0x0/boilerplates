---
id: "runner_ubuntu"
vm_id: 310
template_id: "1010"
hostname: "runner-ubuntu"
domain: "net.local"
cpu_type: "x86-64-v2-AES"
cpu_cores: 4
cpu_sockets: 1
memory: 4096
vm_user: "sysadmin"
startup:
  order: "1"
disks:
  disk0:
    interface: "virtio0"
    storage: "local-lvm"
    size: 10
    iothread: true
    discard: "ignore"
vm_tags: ["runner", "dind", "gitlab", "ubuntu", "terraform", "automation"]
template_tag: "router"
started: true
onboot: false
target_node: "pve"
target_node_domain: ""
dns_servers: ["8.8.8.8", "8.8.4.4"]
firewall_enabled: true
secgroups:
  - security_group: "gitlab-runners"
    comment: "From security group"
    iface: "net0"
network_devices:
  ens18:
    bridge: "vnet01"
    addresses: "10.0.0.22/24"
    gateway4: "10.0.0.1"
    firewall: true
    routes:
      - to: "default"
        via: "10.0.0.1"
        metric: "10"          
users:
  - name: "user"
    password: "$6$tGz.h5alKsD5IOP2$yfQ1RTnXjdLnmCQxFG70Jf3d24YAb8Bsb/qZ/iW0aokkahPQ8qlRhgC2ZpVYkcK.CQh579k3IF3f2LTDAMsKH/"
    groups: "[adm, sudo]"
    lock_passwd: "false"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: "/bin/bash"
    ssh_authorized_keys: "\n      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP1oFq0GYt8j7vg2nNAJNzwBtqrdOUDp8CMQwLRiz4Vz user@ull"

files:
  - path: "/etc/gitlab-runner/config.toml"
    permissions: "0600"
    content: |
      concurrent = 1
      check_interval = 0
      connection_max_age = "15m0s"
      shutdown_timeout = 0
      
      [session_server]
        session_timeout = 1800
      
      [[runners]]
        name = "ubuntu"
        url = "https://gitlab.com"
        id = 51778388
        token = "glrt-4MK1NlNGc9aJvaeMY2hKwWc6MTlmaDZ3Cm86MQp0OjIKdToyZ2lzZhg.01.1j0j3omkq"
        token_obtained_at = 2026-02-13T10:48:57Z
        token_expires_at = 0001-01-01T00:00:00Z
        executor = "docker"
        [runners.cache]
          MaxUploadedArchiveSize = 0
          [runners.cache.s3]
          [runners.cache.gcs]
          [runners.cache.azure]
        [runners.docker]
          tls_verify = false
          image = "alpine"
          privileged = false
          disable_entrypoint_overwrite = false
          oom_kill_disable = false
          disable_cache = false
          volumes = ["/cache"]
          shm_size = 0
          network_mtu = 0
      
      [[runners]]
        name = "ubuntu"
        url = "https://gitlab.com"
        id = 51778466
        token = "glrt-VFMyGfu6Ah7wPaJ84NDp2mc6MTlmaDZ3Cm86MQp0OjIKdToyZ2lzZhg.01.1j1och5b2"
        token_obtained_at = 2026-02-13T10:57:09Z
        token_expires_at = 0001-01-01T00:00:00Z
        executor = "docker"
        [runners.cache]
          MaxUploadedArchiveSize = 0
          [runners.cache.s3]
          [runners.cache.gcs]
          [runners.cache.azure]
