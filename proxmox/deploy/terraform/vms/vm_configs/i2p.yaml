---
id: "i2p"
vm_id: 790
replicas: 1
template_id: "1100"
hostname: "i2p"
domain: "net.local"
cpu_type: "x86-64-v2-AES"
cpu_cores: 1
cpu_sockets: 1
memory: 512
vm_user: "sysadmin"
disks:
  disk0:
    interface: "virtio0"
    storage: "local-lvm"
    size: 5
    iothread: true
    discard: "ignore"
vm_tags: ["test", "i2p", "alpine", "terraform", "replicas", "nodocker"]
template_tag: "router"
started: true
onboot: true
target_node: "pve"
target_node_domain: ""
dns_servers: ["1.1.1.1"]
firewall_enabled: false
network_devices:
  eth0:
    bridge: "vnet01"
    addresses: "10.0.1.80/24"
    gateway4: "10.0.1.254"
    firewall: false
    dhcp: false
users:
  - name: "user"
    # yamllint disable-line rule:line-length
    password: "$6$tGz.h5alKsD5IOP2$yfQ1RTnXjdLnmCQxFG70Jf3d24YAb8Bsb/qZ/iW0aokkahPQ8qlRhgC2ZpVYkcK.CQh579k3IF3f2LTDAMsKH/"
    groups: "[adm, sudo]"
    lock_passwd: "false"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: "/bin/bash"
    # yamllint disable-line rule:line-length
    ssh_authorized_keys: "\n      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP1oFq0GYt8j7vg2nNAJNzwBtqrdOUDp8CMQwLRiz4Vz user@ull"

files:
