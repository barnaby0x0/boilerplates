#     dest: "192.168.1.5"
#     dport: "80"
#     proto: "tcp"
#     log: "info"
#     enabled: false

network_devices:
  eth0:
    bridge: "vnet01"
    addresses: "10.0.0.83/24"
    gateway4: "10.0.0.1"
    firewall: false
    dhcp: false
    routes:
      - to: "default"
        via: "10.0.0.1"
        metric: "1"
users:
  - name: "user"
    password: "$6$tGz.h5alKsD5IOP2$yfQ1RTnXjdLnmCQxFG70Jf3d24YAb8Bsb/qZ/iW0aokkahPQ8qlRhgC2ZpVYkcK.CQh579k3IF3f2LTDAMsKH/"
    groups: "[adm, sudo]"
    lock_passwd: "false"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: "/bin/bash"
    ssh_authorized_keys: "\n      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP1oFq0GYt8j7vg2nNAJNzwBtqrdOUDp8CMQwLRiz4Vz user@ull"

files: []

cmds: [
  "usermod -aG docker user"
]
cloudinit_templates:
  user_data_path: "cloud-init/user_data_hostname"

deploy: true
