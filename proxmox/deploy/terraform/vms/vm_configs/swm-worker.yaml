---
id: "swarm_worker"
vm_id: 610
replicas: 1
template_id: "1000"
hostname: "worker"
domain: "net.local"
cpu_type: "x86-64-v2-AES"
cpu_cores: 2
cpu_sockets: 1
memory: 1024
vm_user: "sysadmin"
disks:
  disk0:
    interface: "virtio0"
    storage: "local-lvm"
    size: 10
    iothread: true
    discard: "ignore"  
vm_tags: ["swarm","worker", "alpine", "terraform"]
template_tag: "swarm_worker"
started: true
onboot: true
target_node: "pve"
target_node_domain: ""
dns_servers: ["8.8.8.8", "8.8.4.4"]
firewall_enabled: false
