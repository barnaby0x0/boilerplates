onboot: true
target_node: "pve"
target_node_domain: ""
dns_servers: ["1.1.1.1"]
firewall_enabled: false
network_devices:
  eth0:
    bridge: "vnet01"
    addresses: "10.0.1.1/24"
    gateway4: "10.0.1.254"
    firewall: false
    dhcp: false
