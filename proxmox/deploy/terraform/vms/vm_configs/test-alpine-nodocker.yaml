files:
  # - path: /etc/tor/torrc
  #   content: |
  #     #SOCKSPort 9050 # Default: Bind to localhost:9050 for local connections.
  #     #SOCKSPort 192.168.0.1:9100 # Bind to this address:port too.

  #     #SOCKSPolicy accept 192.168.0.0/16
  #     #SOCKSPolicy accept6 FC00::/7
