  #     #%include /etc/torrc.d/*.conf
  #   permissions: '0644'
  #   owner: root:root

  - path: /root/tor-router-pre.sh
    content: |
      #!/bin/bash
      _tor_uid=$(id -u tor)
      _trans=9050 _dns=5353
      _nontor="192.168.1.0/24 192.168.0.0/24 10.0.0.0/24"
      
      # !!! sysctl -w net.ipv4.conf.all.route_localnet=1
      # Sur les kernels Linux modernes (depuis ~2.6.37, et surtout 3.x+),
      # le noyau rejette par défaut les paquets qui arrivent de l'extérieur mais qui ont dst=127.0.0.0/8 
      # (considérés comme "martian" ou invalides pour du trafic externe). C'est une mesure de sécurité.
      sysctl -w net.ipv4.conf.all.route_localnet=1

      # Activate the forwarding
      sysctl -w net.ipv4.ip_forward=1
      
      # Flush
      iptables -t nat -F
      iptables -F
      iptables -t nat -X
      iptables -X

      iptables -t nat -N TOR
      iptables -t nat -N CUSTOM
      
      # Still useful ? 
      #iptables -t nat -A OUTPUT -m owner --uid-owner $_tor_uid -j RETURN

      iptables -t nat -A PREROUTING -p tcp --dport 22 -j RETURN
      iptables -t nat -A PREROUTING -j TOR
      # DNS MANAGEMENT
      iptables -t nat -A TOR -p udp --dport 53 -j DNAT --to-destination 127.0.0.1:5353
      
      for NET in $_nontor 127.0.0.0/9 127.128.0.0/10; do
          iptables -t nat -A TOR -d $NET -j RETURN
      done
      
      # PREROUTING pour gérer le forward en moide router
      iptables -t nat -A TOR -p tcp -j REDIRECT --to-ports 2080
      iptables -t nat -A TOR -p udp -j REDIRECT --to-ports 2080
      iptables -t nat -A TOR  -p icmp -j REDIRECT --to-ports 2080
      #iptables -t nat -A TOR -p tcp -m multiport --dports 80,443 -j REDIRECT --to-ports 2080
      #iptables -t nat -A TOR -p tcp -j DNAT --to-destination 127.0.0.1:9050
      
      iptables -tnat -A POSTROUTING -j CUSTOM
      iptables -tnat -A CUSTOM -o eth0 -d 10.0.0.0/8 -j ACCEPT
      iptables -tnat -A CUSTOM -o eth0 -d 192.168.1.0/24 -j ACCEPT
      iptables -tnat -A CUSTOM -o eth0 -j MASQUERADE
    permissions: '0755'
    owner: root:root  

  - path: /root/tor-router.sh
    content: |
      #!/bin/bash
      _tor_uid=$(id -u tor)
      _trans=9050 _dns=5353
      _nontor="192.168.1.0/24 192.168.0.0/24 10.0.0.0/24"

      # Flush
      iptables -t nat -F; iptables -F OUTPUT

      #iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
      iptables -t nat -A OUTPUT -m owner --uid-owner $_tor_uid -j RETURN
      iptables -t nat -A OUTPUT -p udp --dport 53 -j REDIRECT --to-ports 5353

      for NET in $_nontor 127.0.0.0/9 127.128.0.0/10; do
          iptables -t nat -A OUTPUT -d $NET -j RETURN
      done

      ## FOR ROUTER MODE
      iptables -t nat -A PREROUTING -p udp --dport 53 -j REDIRECT --to-ports 5353
      #iptables -t nat -A PREROUTING -p tcp -j DNAT --to-destination 127.0.0.1:9050
      iptables -t nat -A PREROUTING -p tcp -m multiport --dports 80,443 -j REDIRECT --to-ports 2080

      iptables -t nat -A OUTPUT -p tcp -m multiport --dports 80,443 -j REDIRECT --to-ports 2080
      iptables -t nat -A OUTPUT -p tcp -j DNAT --to-destination 127.0.0.1:9050
      # iptables -t nat -A OUTPUT -p tcp --syn -j REDIRECT --to-ports $TRANS_PORT
      iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

    permissions: '0755'
    owner: root:root

