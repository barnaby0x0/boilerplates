---
id: "testmachinealpine"
vm_id: 700
replicas: 2
template_id: "1000"
hostname: "testmachinealpine"
domain: "net.local"
cpu_type: "x86-64-v2-AES"
cpu_cores: 4
cpu_sockets: 1
memory: 4096
vm_user: "sysadmin"
disks:
 disk0:
    interface: "virtio0"
    storage: "local-lvm"
    size: 45
    iothread: true
    discard: "ignore"
# bios: "ovmf"
# efi_disk:
#   datastore_id: "local-lvm"
#   file_format: "raw"
#   type: "4m"
#   pre_enrolled_keys: false      
vm_tags: ["test", "alpine", "terraform", "replicas"]
template_tag: "router"
started: true
onboot: true
target_node: "pve"
target_node_domain: ""
dns_servers: ["8.8.8.8", "8.8.4.4"]
firewall_enabled: false
secgroups:
  - security_group: "test700"
    comment: "From security group"
    iface: "net0"
# fw_rules:
#   - type: "in"
#     action: "ACCEPT"
#     comment: "Allow HTTP"
#     dest: "192.168.1.5"
#     dport: "80"
#     proto: "tcp"
#     log: "info"
#     enabled: false

network_devices:
