      ssh user@10.10.0.12 "docker run -e SSHPASS=toor -t -v nix-store:/nix 10.0.0.250:5000/nixos-anywhere bash -ic \"nix-shell -p nixos-anywhere --run 'nixos-anywhere --flake .#serveur --build-on local --env-password --option require-sigs false --debug user@10.0.0.90'\""
