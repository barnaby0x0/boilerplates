    content: |
      nameserver 8.8.8.8
      nameserver 8.8.4.4
    permissions: '0644'
    owner: root:root
  - path: /home/user/cmd
    content: |
      #!/bin/sh
      #ssh user@10.10.0.12 "docker run -t -v nix-store:/nix 10.0.0.250:5000/nixos-anywhere bash -ic \"colmena --help\""
